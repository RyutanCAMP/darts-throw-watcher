name: Build test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk throw-watcher-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: throw-watcher-test
          path: throw-watcher-test.apk

      # スマホからログインなしでダウンロードできるように、リリースにも置く
      # main = 安定版（test-latest。旧版に戻すときもここから）／それ以外のブランチ = 実機テスト中の版（test-pr）
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: test-latest
          name: 投擲ウォッチャー テスト版（最新）
          prerelease: true
          make_latest: false
          files: throw-watcher-test.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref != 'refs/heads/main'
        with:
          tag_name: test-pr
          name: 投擲ウォッチャー 実機テスト中（${{ github.ref_name }}）
          prerelease: true
          make_latest: false
          files: throw-watcher-test.apk
